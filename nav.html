<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Xavier</title>
  <link rel="stylesheet" href="nav.css">
</head>
<body>
<header>
  <a class="brand" href="/nav.html">Xavier</a>
  <span id="mode-badge" class="badge sim">Sim</span>
</header>
<main>
  <section class="stage" aria-label="Scan">
    <div class="toolbar">
      <div class="seg" id="views" aria-label="View">
        <button data-view="floorplan" aria-pressed="false">Plan</button>
        <button data-view="inside" aria-pressed="false">Inside</button>
      </div>
      <div class="seg" id="floors" aria-label="Floor"></div>
      <span id="hint"></span>
    </div>
    <div class="viewer">
      <iframe id="scan" title="Building scan" allow="fullscreen; xr-spatial-tracking"></iframe>
      <svg id="overlay" aria-hidden="true"></svg>
      <p id="boot" role="status">Loading…</p>
    </div>
    <ul class="legend" aria-label="Legend">
      <li><i class="route-chair"></i>Path</li>
      <li id="legend-matterport" hidden><i class="route-walk"></i>On foot</li>
      <li><i class="hop elevator"></i>Elevator</li>
      <li><i class="obstacle"></i>Obstacle</li>
    </ul>
  </section>

  <aside>
    <section class="panel">
      <label for="from">From</label><select id="from"></select>
      <label for="to">To</label><select id="to"></select>
      <label for="chair-preset">Chair</label>
      <select id="chair-preset">
        <option value="manual">Manual · 64 cm</option>
        <option value="power">Power · 70 cm</option>
        <option value="xavier" selected>Xavier · 70 cm</option>
      </select>
      <label class="check"><input id="compare" type="checkbox"> On-foot compare</label>
      <div class="buttons">
        <button class="primary" id="plan" disabled>Plan</button>
        <button id="drive" disabled>Drive</button>
        <button id="stop" disabled>Stop</button>
      </div>
      <p id="route-text" role="status"></p>
    </section>

    <section class="panel">
      <div class="buttons" id="obstacles">
        <button id="add-obstacle" disabled>Add obstacle</button>
        <button id="go-around" disabled>Detour</button>
        <button id="block" disabled>Block hallway</button>
        <button id="clear-obstacles" disabled>Clear</button>
      </div>
      <p id="sim-text" class="fine" hidden></p>
      <p id="st-mode" hidden>Simulated</p>
      <p id="st-chair" class="fine" role="status"></p>
      <p id="st-next" hidden></p>
      <p id="st-local" hidden></p>
      <p id="st-global" hidden></p>
      <ol id="log" hidden aria-hidden="true"></ol>
    </section>
  </aside>
</main>
<script type="module" src="nav.mjs?v=minimal-1"></script>
</body>
</html>
